<br></br><hr>
<label for="snp" class="margin-toggle"><a href="/posts.html"><strong>All Posts</strong></a><hr></label><input type="checkbox" id="snp" class="margin-toggle" /><div class="marginnote"><a href="/posts.html"><strong>All Posts</strong></a></div>
$for(posts)$
  <div class="posts">
    <div style="text-align: left">
      <a href=$url$>
        <span style="font-size: 1.2em; font-family: var(--title-fonts);">
          $title$
        </span>
      </a>
      <span style="font-size: 1rem; float: right;">
        $if(tags)$ $tags$ $endif$
      </span>
    </div>
    $teaser$
    <p>—$date$, $num-words$ words ($estimated-reading-time$)</p>
  </div>
$endfor$
